<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lettered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Lettered: a private room. Monochrome, photography-led, almost no chrome. */
  --night:#0C0C0B;
  --night-2:#161614;
  --night-3:#24231F;
  --bone:#F1EEE7;
  --ash:#8C8980;
  --smoke:#5C5A54;
  --line:#1C1C1A;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
/* Light appearance, set from Settings. Photos keep their own dark context. */
.screen[data-theme="light"]{--night:#F1EEE7;--night-2:#E8E4DB;--night-3:#D5D0C4;--bone:#141412;--ash:#6F6C64;--smoke:#9C988E;--line:#DEDACF;color-scheme:light}
.onphoto{--bone:#F1EEE7;--ash:#B9B5AC;--smoke:#8C8980;--night:#0C0C0B;--night-2:#161614;--night-3:#24231F;color:#F1EEE7}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050505;color:#F1EEE7;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
:focus-visible{outline:1px solid var(--bone);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:80px;padding:40px 24px}
.index{width:260px;display:flex;flex-direction:column;gap:22px;max-height:844px;overflow-y:auto;scrollbar-width:none}
.index .wm{font-family:var(--serif);font-weight:300;font-size:40px;letter-spacing:-.5px;line-height:1}
.index p{color:var(--ash);font-size:14px;line-height:1.6}
.index nav{display:flex;flex-direction:column}
.index nav button{padding:8px 0;font-size:14px;color:var(--ash);border-bottom:1px solid #1C1C1A;display:flex;justify-content:space-between}
.index nav button span{color:var(--smoke);font-variant-numeric:tabular-nums}
.index nav button[aria-current="true"]{color:#F1EEE7}
.index h4{font-size:12px;color:var(--smoke);font-weight:500;margin:12px 0 2px}
.index .reset{font-size:13px;color:var(--smoke);border-bottom:1px solid #2a2a27;align-self:flex-start;padding-bottom:2px}

.phone{width:390px;height:844px;border-radius:56px;background:#000;padding:9px;box-shadow:0 0 0 1px #222,0 50px 100px -30px rgba(0,0,0,.9);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--night);color:var(--bone)}
@media (max-width:820px){
  .index{display:none}.stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}
}

.status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0;font-size:15px;font-weight:600;z-index:6;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease-out;background:var(--night)}
@keyframes in{from{opacity:0}}
.pad{padding:0 28px}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}.scroll::-webkit-scrollbar{display:none}

.wm{font-family:var(--serif);font-weight:300;letter-spacing:-.02em;line-height:1}
.muted{color:var(--ash)}
.small{font-size:13px;line-height:1.55}

.cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:28px;background:var(--bone);color:var(--night);font-weight:600;font-size:16px;text-align:center;transition:transform .12s}
.cta:active{transform:scale(.985)}
.cta.ghost{background:none;color:var(--bone);box-shadow:inset 0 0 0 1px var(--night-3)}
.cta[disabled]{opacity:.35;cursor:default}
.textlink{display:block;width:100%;text-align:center;font-size:15px;color:var(--ash);padding:14px 0}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;flex:none}
.top{height:56px;margin-top:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex:none}
.top .tt{font-size:16px;font-weight:500}
.top .side{min-width:44px;display:flex;justify-content:flex-end}
.foot{padding:12px 28px 36px;display:flex;flex-direction:column;gap:4px;flex:none}
.pill{height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:500;box-shadow:inset 0 0 0 1px var(--night-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.solid{background:var(--bone);color:var(--night);box-shadow:none}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}

/* website */
.site{background:#F1EEE7;color:#141412}
.site .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:120px 30px 30px}
.site .wm{font-size:64px}
.site p{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.3;max-width:280px;margin-top:22px}
.site .meta{font-family:var(--sans);font-size:13px;color:#77746C;line-height:1.6}
.safari{height:86px;background:#E6E2D9;border-top:1px solid #D3CEC2;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:10px}
.safari .url{width:88%;height:42px;border-radius:13px;background:#F7F5F0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#141412;gap:6px}
.site .open{font-size:15px;font-weight:600;border-bottom:1px solid #141412;align-self:flex-start;padding-bottom:2px}

/* door */
.door .hero{padding:150px 28px 0}
.door .wm{font-size:58px}
.choices{margin-top:auto;border-top:1px solid var(--night-3)}
.choice{display:flex;align-items:center;justify-content:space-between;width:100%;padding:24px 28px;border-bottom:1px solid var(--night-3)}
.choice b{display:block;font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:-.01em}
.choice span{display:block;font-size:13px;color:var(--ash);margin-top:4px}

/* forms */
.h{font-family:var(--serif);font-weight:300;font-size:40px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:15px;color:var(--ash);line-height:1.6;margin-top:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:24px}
.field label{font-size:12px;color:var(--ash)}
.field input,.field textarea,.field select{background:none;border:0;border-bottom:1px solid var(--night-3);padding:10px 0;font-size:18px;border-radius:0;width:100%}
.field select{appearance:none;-webkit-appearance:none}
.field select option{background:#161614;color:#F1EEE7}
.field textarea{resize:none;height:84px;font-size:16px;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-bottom-color:var(--bone)}
.field input::placeholder,.field textarea::placeholder{color:var(--smoke)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.progress{display:flex;gap:6px;width:72px}
.progress i{flex:1;height:2px;background:var(--night-3)}.progress i.on{background:var(--bone)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kinds button{height:38px;padding:0 16px;border-radius:19px;font-size:14px;box-shadow:inset 0 0 0 1px var(--night-3);color:var(--ash)}
.kinds button[aria-pressed="true"]{background:var(--bone);color:var(--night);box-shadow:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px}
.photos button,.photos label{aspect-ratio:3/4;border-radius:10px;background:var(--night-2);display:grid;place-items:center;color:var(--smoke);font-size:24px;font-weight:300;overflow:hidden;cursor:pointer;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos input{position:absolute;opacity:0;width:1px;height:1px}
.photos .edit{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:600;background:rgba(12,12,11,.7);color:#F1EEE7;padding:3px 8px;border-radius:10px}

/* quiet states */
.quiet{justify-content:center;padding:0 32px}
.quiet .h{font-size:46px}
.quiet>.wm{font-size:22px;position:absolute;top:70px;left:32px}
.rule{width:28px;height:1px;background:var(--ash);margin:26px 0}

/* mail */
.mail{background:#FFFFFF;color:#111}
.mail .bar{height:56px;margin-top:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#0A60FF;font-size:17px}
.mail .from{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid #EAEAEA}
.mail .av{width:40px;height:40px;border-radius:20px;background:#111;color:#F1EEE7;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:300}
.mail .from b{font-size:16px;display:block}.mail .from span{font-size:13px;color:#8A8A8A}
.mail h2{font-size:24px;font-weight:600;padding:18px 20px 0}
.mail .letter{padding:22px 20px;font-family:var(--serif);font-size:20px;line-height:1.55;font-weight:300;display:flex;flex-direction:column;gap:16px}
.mail .letter a{color:#111;border-bottom:1px solid #111;align-self:flex-start;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer}

/* accepted + membership */
.accept .h{font-size:52px}
.card{margin-top:30px;aspect-ratio:1.586;border-radius:18px;background:linear-gradient(155deg,#1E1E1B 0%,#0F0F0E 60%,#181816 100%);box-shadow:inset 0 0 0 1px #2C2B27,0 30px 50px -20px rgba(0,0,0,.8);padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:#F1EEE7}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(241,238,231,.06) 50%,transparent 60%);animation:sheen 3.2s ease-in-out 1}
@keyframes sheen{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.card .wm{font-size:26px}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:#8C8980}
.card .row b{display:block;color:#F1EEE7;font-size:16px;font-weight:500;margin-top:3px;letter-spacing:.02em}
.price{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--night-3);margin-top:22px}
.price b{font-family:var(--serif);font-weight:300;font-size:30px;font-variant-numeric:tabular-nums}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;animation:in .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--night-2);border-radius:34px;padding:22px 22px 26px;z-index:9;animation:up .3s cubic-bezier(.2,.8,.2,1);max-height:80%;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(100%)}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;margin-bottom:6px}
.sheet .x{width:30px;height:30px;border-radius:15px;background:var(--night-3);display:grid;place-items:center;color:var(--ash);font-size:13px}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 2px;border-bottom:1px solid var(--line);font-size:16px}
.sheet .opt:last-child{border-bottom:0}
.sheet .opt.danger{color:#D9826F}
.sheet .opt i{font-style:normal;color:var(--ash);font-size:14px}
.sheet .field{margin-top:12px}
.sheet .cta{margin-top:18px}
.applepay{background:#1C1C1E;color:#F1EEE7;border-radius:38px}
.applepay .line{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2C2C2E;font-size:15px}
.applepay .line span{color:#9A9AA0}
.applepay .confirm{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#9A9AA0}
.applepay .confirm button{width:100%;height:52px;border-radius:14px;background:#F1EEE7;color:#000;font-weight:600;text-align:center}
.applepay .x{background:#2C2C2E;color:#9A9AA0}

/* tabs */
.tabs{display:flex;justify-content:space-around;padding:10px 6px 30px;border-top:1px solid var(--line);flex:none;background:var(--night)}
.tabs button{font-size:13px;color:var(--smoke);padding:6px 6px;position:relative}
.tabs button[aria-current="true"]{color:var(--bone)}
.tabs button .dot{position:absolute;top:4px;right:-2px;width:6px;height:6px;border-radius:3px;background:var(--bone)}

/* discover */
.dtop{position:absolute;top:52px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:4}
.modes{display:flex;gap:20px}
.modes button{font-family:var(--serif);font-size:22px;font-weight:300;color:rgba(241,238,231,.45)}
.modes button[aria-pressed="true"]{color:#F1EEE7}
.frame{position:relative;flex:1;margin:0;overflow:hidden;background:#161614;min-height:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .tap{position:absolute;top:0;bottom:40%;width:50%;z-index:2}.frame .l{left:0}.frame .r{right:0}
.frame .ticks{position:absolute;top:110px;left:24px;right:24px;display:flex;gap:4px;z-index:3}
.frame .ticks i{flex:1;height:2px;background:rgba(241,238,231,.25)}.frame .ticks i.on{background:#F1EEE7}
.frame .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(to top,rgba(12,12,11,.96) 8%,rgba(12,12,11,0))}
.frame .shadetop{position:absolute;inset:0 0 auto 0;height:180px;background:linear-gradient(to bottom,rgba(12,12,11,.7),rgba(12,12,11,0))}
.cap{position:absolute;left:24px;right:24px;bottom:22px;z-index:3}
.cap h3{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em}
.cap h3 span{color:var(--ash);font-size:30px;margin-left:8px}
.cap .what{font-size:15px;margin-top:8px}
.cap .meta{font-size:13px;color:var(--ash);margin-top:4px}
.cap .note{font-size:14px;color:var(--ash);margin-top:8px;line-height:1.45}
.cap .song{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ash);margin-top:12px}
.cap .song i{width:6px;height:6px;border-radius:3px;background:#F1EEE7;animation:pulse 1.6s ease-in-out infinite}
.cap .visiting{display:inline-block;margin-top:10px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(241,238,231,.3)}
@keyframes pulse{50%{opacity:.25}}
.acts{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;flex:none}
.acts .ring{width:50px;height:50px;border-radius:25px;box-shadow:inset 0 0 0 1px var(--night-3);display:grid;place-items:center;color:var(--ash);flex:none}
.acts .ring[disabled]{opacity:.3;cursor:default}
.acts .pass{height:50px;border-radius:25px;padding:0 22px;font-size:15px;font-weight:500;box-shadow:inset 0 0 0 1px var(--night-3);color:var(--ash)}
.acts .yes{height:50px;border-radius:25px;background:var(--bone);color:var(--night);flex:1;text-align:center;font-size:15px;font-weight:600}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px}
.empty .h{font-size:40px}

/* match */
.match{justify-content:flex-end;padding:0 28px 40px}
.match .bg{position:absolute;inset:0;opacity:.35}
.match .bg img{width:100%;height:100%;object-fit:cover;filter:blur(2px)}
.match .bgshade{position:absolute;inset:0;background:linear-gradient(to top,var(--night) 35%,transparent)}
.match .content{position:relative}
.match .h{font-size:50px}

/* list rows */
.title{font-family:var(--serif);font-weight:300;font-size:40px;letter-spacing:-.02em;padding:6px 28px 14px}
.search{margin:0 20px 14px;height:44px;border-radius:22px;background:var(--night-2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--smoke);flex:none}
.search input{flex:1;background:none;border:0;font-size:16px;color:var(--bone);min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:var(--smoke)}
.thread{display:flex;gap:14px;align-items:center;width:100%;padding:12px 24px}
.thumb{width:52px;height:52px;border-radius:26px;overflow:hidden;flex:none;background:var(--night-2);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thread .t{flex:1;min-width:0}
.thread b{display:block;font-weight:500;font-size:16px}
.thread .t>span{display:block;color:var(--ash);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread .t>small{display:block;color:var(--smoke);font-size:12px;margin-top:2px}
.thread time{font-size:12px;color:var(--smoke);align-self:flex-start;margin-top:4px;white-space:nowrap}
.thread.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--bone);margin-left:8px;vertical-align:middle}
.newrow{display:flex;gap:12px;padding:0 24px 20px;overflow-x:auto;scrollbar-width:none;flex:none}
.newrow::-webkit-scrollbar{display:none}
.newrow .thumb{width:62px;height:82px;border-radius:12px}
.newrow button{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px;color:var(--ash)}
.sect{font-size:12px;color:var(--smoke);padding:0 24px 6px;font-weight:500}
.none{padding:30px 28px;color:var(--ash);font-size:15px;line-height:1.6}

/* chat */
.chathead{display:flex;align-items:center;gap:12px;height:62px;margin-top:52px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);flex:none}
.chathead .thumb{width:36px;height:36px}
.chathead .who{flex:1;min-width:0}
.chathead b{font-weight:500;display:block}
.chathead small{font-size:12px;color:var(--ash)}
.bubbles{flex:1;overflow-y:auto;padding:16px 16px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;min-height:0}
.day{align-self:center;font-size:12px;color:var(--smoke);margin:12px 0 6px}
.b{max-width:78%;padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.b.them{background:var(--night-2);align-self:flex-start}
.b.me{background:var(--bone);color:var(--night);align-self:flex-end}
.b.typing{color:var(--ash);letter-spacing:2px}
.receipt{align-self:flex-end;font-size:11px;color:var(--smoke);margin-top:-2px}
.reqnote{align-self:center;font-size:12px;color:var(--ash);text-align:center;max-width:260px;line-height:1.5;margin:8px 0}
.compose{display:flex;gap:10px;align-items:center;padding:10px 14px 32px;flex:none}
.compose input{flex:1;height:44px;border-radius:22px;background:var(--night-2);border:0;padding:0 18px;font-size:16px;min-width:0}
.compose input:focus{outline:1px solid var(--night-3)}
.compose button{height:44px;padding:0 16px;border-radius:22px;font-weight:600;font-size:15px}

/* map */
.maptop{height:56px;margin-top:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}
.globe{position:relative;height:330px;flex:none;touch-action:none;cursor:grab}
.globe:active{cursor:grabbing}
.globe canvas{width:100%;height:100%;display:block}
.seg{display:inline-flex;padding:3px;border-radius:18px;background:var(--night-2);margin:4px 20px 14px;flex:none;align-self:flex-start}
.seg button{height:30px;padding:0 16px;border-radius:15px;font-size:13px;color:var(--ash);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bone);color:var(--night)}
.cities{display:flex;gap:10px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none;flex:none;scroll-snap-type:x mandatory}
.cities::-webkit-scrollbar{display:none}
.citycard{flex:none;width:128px;height:168px;border-radius:14px;overflow:hidden;position:relative;scroll-snap-align:start}
.citycard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.citycard span{position:absolute;left:12px;bottom:10px;right:10px;font-size:12px;color:#B9B5AC;line-height:1.3}
.citycard b{display:block;font-family:var(--serif);font-weight:300;font-size:21px;color:#F1EEE7;letter-spacing:-.01em;line-height:1.05}
.cityhero{height:230px;position:relative;flex:none}
.cityhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cityhero .shade{position:absolute;inset:0;background:linear-gradient(to top,var(--night) 2%,rgba(12,12,11,.15) 70%,rgba(12,12,11,.55))}
.cityhero .top{position:relative;z-index:2}
.cityhero h2{position:absolute;left:24px;bottom:12px;z-index:2;font-family:var(--serif);font-weight:300;font-size:44px;letter-spacing:-.02em;line-height:1}
.cityhero h2 small{display:block;font-family:var(--sans);font-size:13px;color:var(--ash);margin-top:8px;letter-spacing:0}

const STOP=new Set(['who','are','in','the','members','member','into','live','lives','that','and','at','of','a','an','from','on','with','people','is','do','based','interested','me','near','you']);
function searchMembers(q){
  q=q.toLowerCase().trim();if(!q)return [];
  let list=P.filter(visible);
  if(/\bnear (me|you)\b|\bnearby\b/.test(q))list=list.filter(p=>km(C[p.city],C[myCity()])<200||(p.trip&&p.trip[0]===myCity()));
  if(/\bwom[ae]n\b|\bgirls?\b/.test(q))list=list.filter(p=>p.g==='w');
  else if(/\bm[ae]n\b|\bguys?\b/.test(q))list=list.filter(p=>p.g==='m');
  q=q.replace(/\bwom[ae]n\b|\bm[ae]n\b|\bgirls?\b|\bguys?\b|\bnearby\b/g,' ');
  const cityHit=CITIES.find(c=>q.includes(c.n.toLowerCase())||(c.k==='la'&&/\bla\b/.test(q))||(c.k==='nyc'&&/\bnyc\b/.test(q)));
  if(cityHit){list=list.filter(p=>p.city===cityHit.k||(p.trip&&p.trip[0]===cityHit.k));q=q.replace(cityHit.n.toLowerCase(),' ').replace(/\b(la|nyc)\b/,' ')}
  const toks=q.split(/[^a-zà-ü0-9]+/).filter(t=>t&&!STOP.has(t)).map(t=>t.replace(/(ers|ing|ians|ian|es|s)$/,'')||t);
  return list.filter(p=>{const hay=[p.n,p.what,p.school,p.cat,p.note,cityLabel(p.city),C[p.city].c,p.cat==='Olympian'?'olympic olympian':'',p.cat==='Pro athlete'?'professional pro':'',p.cat==='College athlete'?'college ncaa d1':'',p.cat==='Fitness'?'trainer gym':''].join(' ').toLowerCase();
    return toks.every(t=>hay.includes(t))});
}

invite:()=>`<section class="view">${stat()}

  <div class="foot"><button class="cta" data-act="rosterok">Confirm my roster</button></div>
</section>`,

apply:()=>{
  const st=S.step;let b='';
  if(st===1) b=`<h2 class="h">Tell us who you are.</h2>
    <p class="lead">Athletes, surfers, skaters, coaches. If you live it, apply.</p>
    <div class="field"><label>What describes you? Pick all that fit.</label><div class="kinds" role="group">${['College athlete','Pro athlete','Surf','Skate','Fitness','Coach','Other'].map(k=>`<button data-kind="${k}" aria-pressed="${S.kinds.includes(k)}">${k}</button>`).join('')}</div></div>
    <div class="field"><label for="nm">First name</label><input id="nm" data-me="n" value="${esc(S.me.n)}" autocomplete="off"></div>
    <div class="field"><label for="ig">Instagram</label><input id="ig" data-me="ig" value="${esc(S.me.ig)}" placeholder="@handle" autocomplete="off"></div>`;
  if(st===2) b=`<h2 class="h">Six photos. Make them count.</h2>
    <p class="lead">The committee sees these first. No group shots, no filters.</p>
    <div class="photos">${[0,1,2,3,4,5].map(i=>`<button data-act="addphoto" aria-label="Add photo ${i+1}">${i<S.added?`<img src="${pic(P[(i+1)%P.length].id,i%3)}" alt="">`:'+'}</button>`).join('')}</div>
    <div class="field"><label for="sg">The song that plays on your profile</label><input id="sg" data-me="song" value="${esc(S.me.song)}" placeholder="Song and artist" autocomplete="off"></div>`;
  if(st===3) b=`<h2 class="h">Who knows you here?</h2>
    <p class="lead">A member who vouches for you helps. It doesn’t guarantee anything.</p>
    <div class="field"><label for="vc">Member who can vouch for you</label><input id="vc" placeholder="Optional" autocomplete="off"></div>
    <div class="field"><label for="why">What would you add to the room?</label><textarea id="why" placeholder="Keep it short."></textarea></div>`;

  <div class="top">${back(st===1?'door':'apply-back')}<div class="progress" aria-label="Step ${st} of 3">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div></div>
  <div class="scroll pad">${b}<div style="height:20px"></div></div>
  <div class="foot"><button class="cta" data-act="next">${st<3?'Continue':'Submit to the committee'}</button></div>
</section>`},

pending:()=>`<section class="view quiet">${stat()}
  <div class="wm">lettered</div>
  <h2 class="h">Received.</h2>
  <div class="rule"></div>
  <p class="lead" style="margin:0">The committee reviews every application. We don’t share timelines, positions or decisions in progress.</p>
  <p class="lead">If you’re accepted, you’ll hear from us.</p>
</section>`,

mail:()=>`<section class="view mail">${stat(false)}
  <div class="bar"><span>‹ Inbox</span><span style="color:#8A8A8A;font-size:14px">8:12 AM</span></div>

    <span>${esc(S.me.n)},</span>

    <a data-go="accepted" role="button" tabindex="0">Open Lettered</a>
  </div>
</section>`,

accepted:()=>`<section class="view accept">${stat()}
  <div class="scroll pad" style="padding-top:110px">
    <h2 class="h">${S.door==='roster'?'You were expected.':'Accepted.'}</h2>
    <p class="lead">${S.door==='roster'?'Your roster checked out. Your membership is ready when you are.':'The committee said yes. It doesn’t say that often.'}</p>
    <div class="card" aria-label="Membership card">
      <div class="wm">lettered</div>

    </div>

  </div>
  <div class="foot"><button class="cta" data-act="pay">Start membership</button><button class="textlink" data-go="code">I have a code</button></div>
</section>`,

code:()=>`<section class="view">${stat()}
  <div class="top">${back('accepted')}<span></span></div>
  <div class="scroll pad">
    <h2 class="h">Enter your code.</h2>
    <p class="lead">Codes come from the founder. They cover your membership in full.</p>
    <div class="field"><label for="cc">Code</label><input id="cc" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" style="letter-spacing:.12em;text-transform:uppercase"></div>
  </div>
  <div class="foot"><button class="cta" data-act="usecode">Apply code</button></div>
</section>`,

discover:()=>{
  const D=deck(),p=D[0];
  const head=`<div class="dtop onphoto"><div class="modes" role="group" aria-label="Mode">${['Date','Friends'].map(m=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${m}</button>`).join('')}</div><span class="muted small">${esc(cityLabel(myCity()))}</span></div>`;
  if(S.set.pause) return `<section class="view">${stat()}<div class="empty"><h2 class="h">You’re paused.</h2><p class="lead">Nobody sees you in Discover, and you don’t see them. Your matches and messages stay.</p><div style="margin-top:28px"><button class="cta" data-act="unpause">Unpause</button></div></div>${tabs('discover')}</section>`;
  if(!p) return `<section class="view">${stat()}<div style="height:104px;flex:none;position:relative">${head.replace('onphoto','')}</div>
    <div class="empty"><h2 class="h">That’s everyone for now.</h2><p class="lead">New members come in quietly. Check back, or look further afield on the map.</p>
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:4px"><button class="cta" data-act="lookagain">See who you passed</button>${S.set.maps?'<button class="textlink" data-go="map">Open the map</button>':''}</div></div>${tabs('discover')}</section>`;
  const t=trip(p);
  return `<section class="view">
  <div class="frame onphoto">${statPhoto()}
    <img src="${pic(p.id,S.ph)}" alt="${esc(p.n)}, photo ${S.ph+1} of 3">
    <div class="shadetop"></div><div class="shade"></div>
    ${head}
    <div class="ticks">${[0,1,2].map(i=>`<i class="${i===S.ph?'on':''}"></i>`).join('')}</div>
    <button class="tap l" data-act="prev" aria-label="Previous photo"></button><button class="tap r" data-act="nextph" aria-label="Next photo"></button>
    <button class="cap" data-act="viewp" data-who="${p.id}" style="text-align:left">
      <h3>${esc(p.n)}<span>${p.age}</span></h3><p class="what">${esc(lineFor(p))}</p>
      <p class="meta">@${esc(p.ig)} · ${esc(cityLabel(p.city))}</p>
      ${t&&t.city===myCity()?`<span class="visiting">In ${esc(C[t.city].n)} ${fmtD(t.from)} to ${fmtD(t.to)}</span>`:''}
      <p class="note">${esc(p.note)}</p><p class="song"><i></i>${esc(p.song)}</p></button>
  </div>
  <div class="acts">
    <button class="ring" data-act="undo" aria-label="Undo" ${S.hist.length?'':'disabled'}>${ico.undo}</button>
    <button class="pass" data-act="pass">Pass</button>
    <button class="yes" data-act="yes">${S.mode==='Date'?'Interested':'Let’s train'}</button>
    <button class="ring" data-act="request" data-who="${p.id}" aria-label="Direct request">${ico.send}</button>
  </div>
  ${tabs('discover')}
</section>`},

match:()=>{const p=PM[S.viewing];return `<section class="view match">
  <div class="bg"><img src="${pic(p.id)}" alt=""></div><div class="bgshade"></div>${stat()}
  <div class="content">
    <h2 class="h">${p.m.includes('Date')&&S.mode==='Date'?`${esc(p.n)} is interested too.`:`${esc(p.n)} is in.`}</h2>

    </div>
  </div>
</section>`},

member:()=>{const p=PM[S.viewing];if(!p)return V.discover();const t=trip(p);const th=S.threads[p.id];
  const matched=S.matched[p.id];
  return `<section class="view">
  <div class="frame onphoto">${statPhoto()}
    <img src="${pic(p.id,S.ph)}" alt="${esc(p.n)}, photo ${S.ph+1} of 3">
    <div class="shadetop"></div><div class="shade"></div>
    <div class="dtop"><button class="back" data-go="${S.from||'discover'}" aria-label="Back">${ico.back}</button><button class="icon" data-act="memmenu" data-who="${p.id}" aria-label="More">${ico.more}</button></div>
    <div class="ticks">${[0,1,2].map(i=>`<i class="${i===S.ph?'on':''}"></i>`).join('')}</div>
    <button class="tap l" data-act="prev" aria-label="Previous photo"></button><button class="tap r" data-act="nextph" aria-label="Next photo"></button>
    <div class="cap"><h3>${esc(p.n)}<span>${p.age}</span></h3><p class="what">${esc(lineFor(p))}</p>
      <p class="meta">@${esc(p.ig)} · ${esc(cityLabel(p.city))}</p>
      ${t?`<span class="visiting">In ${esc(C[t.city].n)} ${fmtD(t.from)} to ${fmtD(t.to)}</span>`:''}
      <p class="note">${esc(p.note)}</p><p class="song"><i></i>${esc(p.song)}</p></div>
  </div>
  <div class="acts">
    ${matched||th?`<button class="yes" data-act="chat" data-who="${p.id}">Message</button>`:
      `<button class="ring" data-act="request" data-who="${p.id}" aria-label="Direct request">${ico.send}</button>
       <button class="yes" data-act="likeview" data-who="${p.id}" ${S.liked[p.id]?'disabled style="opacity:.4"':''}>${S.liked[p.id]?'Sent':'Interested'}</button>`}
  </div>
</section>`},

map:()=>{
  const all=globeCities().map(c=>({...c,d:km(C[c.k],C[myCity()])}));
  const list=(S.mapScope==='Nearby'?all.filter(c=>c.d<900):all).sort((a,b)=>S.mapScope==='Nearby'?a.d-b.d:b.ps.length-a.ps.length);
  const here=membersIn(myCity());
  return `<section class="view">${stat()}
  <div class="maptop"><button class="pill" data-go="explore">${esc(C[S.viewCity]?C[S.viewCity].n:'City')} ${ico.down}</button><button class="pill" data-act="addtravel">${ico.plane} Add travel</button></div>
  <div class="scroll">
    <div class="globe" aria-label="Globe of members. Drag to turn it, tap a city."><canvas id="globe"></canvas></div>
    <div class="seg" role="group" aria-label="Scope">${['Nearby','Global'].map(m=>`<button data-scope="${m}" aria-pressed="${S.mapScope===m}">${m}</button>`).join('')}</div>
    <div class="cities">${list.map(c=>`<button class="citycard onphoto" data-city="${c.k}"><img src="${pic('city:'+c.k,hash(c.k)%3)}" alt=""><span><b>${esc(C[c.k].n)}</b>${c.ps.length} ${c.ps.length===1?'member':'members'}</span></button>`).join('')||'<p class="none" style="padding:10px 0">No members near you yet.</p>'}</div>
    <p class="sect" style="padding-top:4px">Around you in ${esc(C[myCity()].n)}</p>
    <div class="avrow">${here.slice(0,12).map(p=>`<button data-act="viewp" data-who="${p.id}" aria-label="${esc(p.n)}">${thumb(p.id)}</button>`).join('')||'<span class="muted small">Nobody yet.</span>'}</div>
  </div>
  ${tabs('map')}
</section>`},

city:()=>{const k=S.viewCity,c=C[k];const live=P.filter(p=>visible(p)&&p.city===k),vis=P.filter(p=>visible(p)&&p.trip&&p.trip[0]===k&&p.city!==k);
  const mine=S.trips.filter(t=>t.city===k);
  return `<section class="view">
  <div class="cityhero onphoto"><img src="${pic('city:'+k,hash(k)%3)}" alt=""><div class="shade"></div>${statPhoto()}
    <div class="top">${back('map')}<button class="pill" style="background:rgba(12,12,11,.45);box-shadow:inset 0 0 0 1px rgba(241,238,231,.2)" data-act="tripto" data-city="${k}">${ico.plane} I’m going</button></div>
    <h2>${esc(c.n)}<small>${esc(c.c)}${mine.length?` · You’re here ${fmtD(mine[0].from)} to ${fmtD(mine[0].to)}`:''}</small></h2></div>
  <div class="scroll" style="padding-top:14px">
    <p class="sect">Members here · ${live.length}</p>
    <div class="avrow">${live.map(p=>`<button data-act="viewp" data-who="${p.id}" aria-label="${esc(p.n)}">${thumb(p.id)}</button>`).join('')}</div>
    ${live.length?`<div class="cards">${live.map(p=>`<button class="mcard onphoto" data-act="viewp" data-who="${p.id}"><img src="${pic(p.id)}" alt=""><div class="shade"></div><div class="c"><b>${esc(p.n)}</b><span>${esc(lineFor(p))}</span></div></button>`).join('')}</div>`:'<p class="none">Nobody lives here yet.</p>'}
    ${vis.length?`<p class="sect">Passing through</p>${vis.map(p=>{const t=trip(p);return `<button class="thread" data-act="viewp" data-who="${p.id}">${thumb(p.id)}<span class="t"><b>${esc(p.n)}</b><span>${esc(lineFor(p))}</span><small>${fmtD(t.from)} to ${fmtD(t.to)} · from ${esc(C[p.city].n)}</small></span></button>`}).join('')}`:''}
    <div style="height:24px"></div>
  </div>
</section>`},

explore:()=>{const cur=myCity();const rest=CITIES.filter(c=>c.k!==cur).sort((a,b)=>a.n.localeCompare(b.n));
  const letters=[...new Set(rest.map(c=>c.n[0].normalize('NFD')[0]))];
  const count=k=>membersIn(k).length;
  const row=c=>`<button class="crow" data-city="${c.k}"><span class="t"><b>${esc(c.n)}${c.k===cur?' <span style="display:inline;color:var(--ash)">'+ico.arrow+'</span>':''}</b><span>${esc(c.r&&c.c==='United States'?c.r+', '+c.c:c.c)}</span></span><em>${count(c.k)||''}</em><span class="pin">${ico.chev}</span></button>`;
  let last='';
  return `<section class="view">${stat()}
  <div class="top">${back('map','Close')}<span class="tt">Explore a city</span><span class="side"></span></div>
  <div class="scroll" id="exscroll">
    <p class="sect" style="padding-top:8px">Where you are</p>${row(C[cur])}
    ${rest.map(c=>{const L=c.n[0].normalize('NFD')[0];const h=L!==last?`<p class="letter-h" id="L-${L}">${L}</p>`:'';last=L;return h+row(c)}).join('')}
    <div style="height:40px"></div>
  </div>
  <nav class="alpha" aria-label="Jump to letter">${letters.map(l=>`<button data-jump="${l}">${l}</button>`).join('')}</nav>
</section>`},

travel:()=>{
  if(S.tripCity){const c=C[S.tripCity];const f=iso(Date.now()+7*DAY),t=iso(Date.now()+10*DAY);
    return `<section class="view">${stat()}
    <div class="top">${back('travel-back')}<span class="tt">Share your next trip</span><span class="side"></span></div>
    <div class="scroll pad">
      <h2 class="h">${esc(c.n)}</h2>
      <p class="lead">Members in ${esc(c.n)} will see you’re coming. Nobody else will.</p>
      <div class="two"><div class="field"><label for="tf">Arriving</label><input type="date" id="tf" value="${f}" min="${iso(Date.now())}"></div>
      <div class="field"><label for="tt">Leaving</label><input type="date" id="tt" value="${t}" min="${iso(Date.now())}"></div></div>
    </div>
    <div class="foot"><button class="cta" data-act="savetrip">Share trip</button></div></section>`}
  const q=(S.travelQ||'').toLowerCase();
  const often=[S.me.city,...S.trips.map(t=>t.city)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  const top=['bcn','mia','ams','mex','rom','tyo','lon','par','bali','cabo'];
  const row=k=>`<button class="crow" data-pick="${k}"><span class="pin">${ico.pin}</span><span class="t"><b>${esc(C[k].n)}</b><span>${esc(C[k].c==='United States'?C[k].r:C[k].c)}</span></span></button>`;
  const results=q?CITIES.filter(c=>(c.n+' '+c.c+' '+c.r).toLowerCase().includes(q)).map(c=>c.k):null;
  return `<section class="view">${stat()}
  <div class="top"><span class="side"></span><span class="tt">Share your next trip</span><button class="side muted" data-go="${S.from||'map'}" style="font-size:15px">Cancel</button></div>
  <p class="small muted" style="padding:0 24px 14px">Let members know where you’re headed, so you can start talking before you land.</p>
  <label class="search">${ico.search}<input id="tq" placeholder="Where are you going?" value="${esc(S.travelQ||'')}" autocomplete="off"></label>
  <div class="scroll" id="tlist">${results?(results.map(row).join('')||'<p class="none">No city by that name yet.</p>'):
    `<p class="sect" style="padding-top:8px">Cities you often visit</p>${often.map(row).join('')}<p class="sect" style="padding-top:18px">Top destinations</p>${top.map(row).join('')}`}<div style="height:30px"></div></div>
</section>`},

trips:()=>`<section class="view">${stat()}
  <div class="top">${back('settings')}<span class="tt">Travel plans</span><span class="side"><button class="muted" data-act="addtravel" style="font-size:15px">Add</button></span></div>
  <div class="scroll">${S.trips.length?S.trips.map((t,i)=>`<div class="crow"><span class="pin">${ico.plane}</span><span class="t"><b>${esc(C[t.city].n)}</b><span>${fmtD(t.from)} to ${fmtD(t.to)}</span></span><button class="muted small" data-rmtrip="${i}">Remove</button></div>`).join(''):'<p class="none">No trips yet. Add one and members there will know you’re coming.</p>'}</div>
</section>`,

directory:()=>{const q=S.dirQ||'';const res=q?searchMembers(q):null;
  return `<section class="view">${stat()}
  <div style="height:58px;flex:none"></div>
  <h2 class="title">Directory</h2>
  <form class="search" id="dirform" role="search">${ico.search}<input id="dq" placeholder="Try “women who surf in San Diego”" value="${esc(q)}" autocomplete="off" enterkeyhint="search"></form>
  <div class="scroll" id="dlist">${res?
    `<div class="resulthd"><b>${res.length} ${res.length===1?'member':'members'}</b><button data-act="clearq">Clear</button></div>
     ${res.length?`<div class="grid">${res.map(p=>`<button class="gcard" data-act="viewp" data-who="${p.id}"><img src="${pic(p.id)}" alt=""><div class="shade"></div><div class="c"><b>${esc(p.n)}</b><span>${esc(p.what)}<br>${esc(cityLabel(p.city))}</span></div></button>`).join('')}</div>`:'<p class="none">Nobody matches that. Try fewer words.</p>'}`:
    `<div class="tiles">${TILES.map(([l,qq])=>{const r=searchMembers(qq);return `<button class="tile" data-q="${qq}"><b>${l}</b><span class="pics">${r.slice(0,3).map(p=>thumb(p.id)).join('')}</span><small>${r.length} ${r.length===1?'member':'members'}</small></button>`}).join('')}</div>`}</div>
  ${tabs('directory')}
</section>`},

messages:()=>{const q=(S.msgQ||'').toLowerCase();
  const th=Object.entries(S.threads).filter(([id,t])=>visible(PM[id])&&t.m.length).map(([id,t])=>({id,t,last:t.m[t.m.length-1]})).sort((a,b)=>b.last[2]-a.last[2])
    .filter(x=>!q||(PM[x.id].n+' '+cityLabel(PM[x.id].city)+' '+x.t.m.map(m=>m[1]).join(' ')).toLowerCase().includes(q));
  const fresh=Object.keys(S.matched).filter(id=>visible(PM[id])&&!(S.threads[id]&&S.threads[id].m.length));
  return `<section class="view">${stat()}
  <div style="height:58px;flex:none"></div><h2 class="title">Messages</h2>
  <label class="search">${ico.search}<input id="mq" placeholder="Search" value="${esc(S.msgQ||'')}" autocomplete="off"></label>
  <div class="scroll" id="mlist">
  ${fresh.length&&!q?`<p class="sect">New</p><div class="newrow">${fresh.map(id=>`<button data-act="chat" data-who="${id}" aria-label="Message ${esc(PM[id].n)}">${thumb(id)}${esc(PM[id].n)}</button>`).join('')}</div>`:''}
  ${th.length?`<p class="sect">Conversations</p>`+th.map(({id,t,last})=>{const p=PM[id];const sent=t.st==='request';
    return `<button class="thread${t.read?'':' unread'}" data-act="chat" data-who="${id}">${thumb(id)}<span class="t"><b>${esc(p.n)}</b><span>${sent&&last[0]==='me'?'→ Request sent':last[0]==='me'?'You: '+esc(last[1]):esc(last[1])}</span><small>${esc(cityLabel(p.city))}</small></span><time>${when(last[2])}</time></button>`}).join(''):`<p class="none">${q?'Nothing matches that.':'No conversations yet.'}</p>`}
  </div>
  ${tabs('messages')}
</section>`},

chat:()=>{const id=S.chatWith,p=PM[id],t=S.threads[id]||{st:'match',m:[]};let lastDay='';

/* =========================================================
   Render + navigation
   ========================================================= */
const NAV=[['Outside',[['site','The website'],['door','Two doors']]],['Getting in',[['invite','Invitation'],['apply','Application'],['pending','Received'],['mail','The email'],['accepted','Accepted'],['code','Code']]],
  ['Inside',[['discover','Discover'],['map','Map'],['explore','Explore a city'],['travel','Add travel'],['directory','Directory'],['messages','Messages'],['chat','Chat'],['you','You'],['edit','Edit profile'],['settings','Settings'],['vouch','Vouches']]]];
const INSIDE=new Set(['discover','match','member','map','city','explore','travel','trips','directory','messages','chat','you','edit','settings','blocked','vouch','membership','legal']);
const app=document.getElementById('app');let tm;
function render(){
  const keep=document.activeElement&&document.activeElement.id&&['dq','mq','tq'].includes(document.activeElement.id)?{id:document.activeElement.id,pos:document.activeElement.selectionStart}:null;
  const sc=document.querySelector('.view .scroll');const scrollTop=sc&&S._lastScreen===S.screen?sc.scrollTop:0;
  app.dataset.theme=INSIDE.has(S.screen)?S.set.theme:'dark';
  app.innerHTML=V[S.screen]()+(S.sheet?SHEETS[S.sheet.k]():'')+'<div class="toast" id="toast" role="status"></div>';
  let i=0;document.getElementById('nav').innerHTML=NAV.map(([g,items])=>`<h4>${g}</h4>`+items.map(([k,l])=>`<button data-go="${k}" aria-current="${S.screen===k}">${l}<span>${String(++i).padStart(2,'0')}</span></button>`).join('')).join('');
  clearTimeout(tm);
  if(S.screen==='pending') tm=setTimeout(()=>{S.screen='mail';render()},4200);
  if(S.screen==='chat'){const b=document.getElementById('bb');b.scrollTop=b.scrollHeight;const t=S.threads[S.chatWith];if(t&&!t.read){t.read=true;save()}}
  if(S.screen==='map')mountGlobe();
  const nsc=document.querySelector('.view .scroll');if(nsc&&scrollTop)nsc.scrollTop=scrollTop;
  S._lastScreen=S.screen;
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.pos,keep.pos)}catch(e){}}}
}
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1900)}
function go(s){
  if(INSIDE.has(s)&&!S.paid){S.screen=S.door?'accepted':'door';S.sheet=null;render();toast('Members only');return}
  if(s==='chat'&&!PM[S.chatWith])S.chatWith=Object.keys(S.threads)[0];
  if(s==='member'&&!PM[S.viewing])S.viewing=P[0].id;
  if(s==='travel'&&S.screen!=='travel'){S.tripCity=null;S.travelQ=''}
  if(['discover','map','directory','messages','you','settings','city','chat'].includes(s)&&s!==S.screen)S.from=s;
  if(s==='edit')S.editPhotos=null;
  S.screen=s;S.sheet=null;if(s==='discover'||s==='member')S.ph=0;save();render()}

/* =========================================================
   Events
   ========================================================= */
document.getElementById('reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.sheet=null;G.lon=-100;G.lat=22;G.auto=true;render()};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-kind],[data-mode],[data-tog],[data-scope],[data-city],[data-jump],[data-pick],[data-q],[data-see],[data-appearance],[data-unblock],[data-rmtrip],[data-legal]');if(!t||!app.contains(t)&&!t.closest('.index'))return;const d=t.dataset;
  if(d.go){if(d.go==='apply-back'){S.step--;render();return}if(d.go==='travel-back'){S.tripCity=null;render();return}
    if(d.go==='apply'){S.door='app';S.step=1}if(d.go==='invite')S.door='roster';if(d.go==='accepted'&&!S.door)S.door='app';
    if(d.go==='vouch')S.from=S.screen;
    if(d.go==='chat'&&!S.threads[S.chatWith])S.chatWith='ava';
    if(d.go==='member'&&!S.viewing)S.viewing='ava';
    if(t.closest('.index')&&INSIDE.has(d.go)&&!S.paid){S.paid='card';S.door=S.door||'app'}
    go(d.go);return}
  if(d.kind){const i=S.kinds.indexOf(d.kind);i<0?S.kinds.push(d.kind):S.kinds.splice(i,1);render();return}
  if(d.mode){S.mode=d.mode;S.ph=0;save();render();return}
  if(d.tog){S.set[d.tog]=!S.set[d.tog];save();render();
    const msg={pause:S.set.pause?'Paused':'You’re back in Discover',school:S.set.school?'Hidden from USC':'USC can see you'}[d.tog];if(msg)toast(msg);return}
  if(d.scope){S.mapScope=d.scope;save();render();return}
  if(d.city){if(S.screen==='travel')return;openCity(d.city);return}
  if(d.jump){const el=document.getElementById('L-'+d.jump);if(el)el.scrollIntoView({block:'start'});return}
  if(d.pick){S.tripCity=d.pick;render();return}
  if(d.q){S.dirQ=d.q;render();return}
  if(d.see){S.set.see=d.see;S.sheet=null;save();render();toast('Saved');return}
  if(d.appearance){S.set.theme=d.appearance;S.sheet=null;save();render();return}
  if(d.unblock){S.blocked=S.blocked.filter(x=>x!==d.unblock);save();render();toast('Unblocked');return}
  if(d.rmtrip){S.trips.splice(+d.rmtrip,1);save();render();toast('Trip removed');return}
  if(d.legal){S.legal=d.legal;go('legal');return}
  const D=()=>deck()[0];
  switch(d.act){
    case 'apply':S.door='app';S.step=1;go('apply');break;
    case 'signin':if(S.paid)go('discover');else toast('No membership on this device yet');break;
    case 'next':{document.querySelectorAll('[data-me]').forEach(i=>{if(i.value.trim())S.me[i.dataset.me]=i.value.trim().replace(/^@/,'')});
      if(S.step<3){S.step++;render()}else go('pending');break}
    case 'addphoto':S.added=Math.min(6,S.added+1);render();break;
    case 'rosterok':S.door='roster';go('accepted');break;
    case 'pay':S.sheet={k:'pay'};render();break;
    case 'closesheet':S.sheet=null;render();break;
    case 'paid':S.paid='card';S.sheet=null;go('discover');break;
    case 'usecode':{const v=(document.getElementById('cc').value||'').trim();if(v.replace(/[^a-z0-9]/gi,'').length<6){toast('That code doesn’t look right');break}S.paid='code';go('discover');setTimeout(()=>toast('Membership covered'),50);break}
    case 'prev':S.ph=(S.ph+2)%3;render();break;
    case 'nextph':S.ph=(S.ph+1)%3;render();break;
    case 'meph':S.mePh=((S.mePh||0)+1)%mePhotoCount();render();break;
    case 'pass':{const p=D();if(p)decide(p,'pass');break}
    case 'yes':{const p=D();if(p)decide(p,'yes');break}
    case 'undo':{const k=S.hist.pop();if(k){const id=k.split(':')[1];if(S.decided[k]==='yes'&&!(S.threads[id]&&S.threads[id].m.length)){delete S.liked[id];if(S.matched[id]&&!['ava','kai','jordan','nia','theo'].includes(id))delete S.matched[id]}delete S.decided[k];S.mode=k.split(':')[0];S.ph=0;save();render()}break}
    case 'lookagain':Object.keys(S.decided).forEach(k=>{if(k.startsWith(S.mode+':')&&S.decided[k]==='pass')delete S.decided[k]});S.hist=[];save();render();break;
    case 'unpause':S.set.pause=false;save();render();break;
    case 'viewp':S.viewing=d.who;S.from=S.screen==='member'?S.from:S.screen;go('member');break;
    case 'likeview':{const p=PM[d.who];S.liked[p.id]=1;S.decided[(p.m.includes(S.mode)?S.mode:p.m[0])+':'+p.id]='yes';if(p.likes){S.matched[p.id]=1;save();go('match')}else{save();render();toast('Sent')}break}
    case 'request':S.sheet={k:'request',who:d.who};render();setTimeout(()=>{const el=document.getElementById('rq');if(el)el.focus()},300);break;
    case 'sendreq':{const v=(document.getElementById('rq').value||'').trim();if(!v){toast('Write something first');break}
      const id=S.sheet.who;S.requests--;S.decided[S.mode+':'+id]='request';S.hist.push(S.mode+':'+id);S.threads[id]={st:'request',read:true,m:[]};S.sheet=null;sendMsg(id,v,true);render();toast('Request sent');break}
    case 'chat':S.chatWith=d.who;if(!S.threads[d.who])S.threads[d.who]={st:'match',read:true,m:[]};go('chat');break;
    case 'memmenu':S.sheet={k:'memmenu',who:d.who};render();break;
    case 'share':S.sheet=null;render();toast('Link copied for members');break;
    case 'report':S.sheet=null;render();toast('Reported. We’ll take it from here.');break;
    case 'unmatch':{const id=d.who;delete S.matched[id];delete S.threads[id];S.sheet=null;save();go('messages');toast('Unmatched');break}
    case 'block':{const id=d.who;if(!S.blocked.includes(id))S.blocked.push(id);delete S.matched[id];S.sheet=null;save();go(S.from&&!['member','chat'].includes(S.from)?S.from:'discover');toast(PM[id].n+' is blocked');break}
    case 'whosee':S.sheet={k:'whosee'};render();break;
    case 'theme':S.sheet={k:'theme'};render();break;
    case 'addtravel':S.from=S.screen;S.tripCity=null;S.travelQ='';S.screen='travel';S.sheet=null;render();break;
    case 'tripto':S.from='city';S.screen='travel';S.tripCity=d.city;render();break;
    case 'savetrip':{const f=new Date(document.getElementById('tf').value+'T12:00').getTime(),to=new Date(document.getElementById('tt').value+'T12:00').getTime();
      if(!f||!to||to<f){toast('Check your dates');break}
      S.trips.push({city:S.tripCity,from:f,to});S.trips.sort((a,b)=>a.from-b.from);const k=S.tripCity;S.tripCity=null;save();openCity(k);toast('Trip shared with members in '+C[k].n);break}
    case 'clearq':S.dirQ='';render();break;
    case 'mailto':location.href='mailto:hello@lettered.club';break;
    case 'logout':S.screen='door';S.sheet=null;save();render();break;
    case 'cancelmem':S.sheet={k:'cancelmem'};render();break;
    case 'endmem':S.paid=null;S.sheet=null;S.door=S.door||'app';save();S.screen='accepted';render();break;
    case 'vouch':{const n=document.getElementById('vn').value.trim(),h=document.getElementById('vh').value.trim();if(!n||!h){toast('Add their name and a way to reach them');break}
      S.vouched.push({n,h});S.vouches--;save();render();toast('Vouch sent');break}
    case 'saveprofile':{const g=id=>document.getElementById(id).value.trim();
      const m=S.me;m.n=g('e-n')||m.n;m.age=g('e-age')||m.age;m.what=g('e-what');m.school=g('e-school');m.ig=g('e-ig').replace(/^@/,'');m.city=g('e-city');m.song=g('e-song');m.note=g('e-note');
      if(S.editPhotos)m.photos=S.editPhotos.filter(Boolean);S.editPhotos=null;S.mePh=0;save();go('you');toast('Saved');break}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='cf'){e.preventDefault();const v=document.getElementById('mi').value.trim();if(!v)return;sendMsg(S.chatWith,v,false);render();const mi=document.getElementById('mi');if(mi)mi.focus()}
  if(e.target.id==='dirform'){e.preventDefault();document.getElementById('dq').blur()}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='dq'){S.dirQ=e.target.value;render()}
  if(id==='mq'){S.msgQ=e.target.value;render()}
  if(id==='tq'){S.travelQ=e.target.value;render()}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||el.dataset.slot==null||!el.files||!el.files[0])return;
  const slot=+el.dataset.slot;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const W=600,H=800,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
      const s=Math.max(W/img.width,H/img.height);x.drawImage(img,(W-img.width*s)/2,(H-img.height*s)/2,img.width*s,img.height*s);
      const ph=S.editPhotos||S.me.photos.slice();while(ph.length<3)ph.push(null);ph[slot]=c.toDataURL('image/jpeg',.8);
      // keep typed fields while re-rendering
      const vals={};document.querySelectorAll('.view input:not([type=file]),.view textarea,.view select').forEach(i=>{if(i.id)vals[i.id]=i.value});
      S.editPhotos=ph;render();Object.entries(vals).forEach(([k,v])=>{const i=document.getElementById(k);if(i)i.value=v})};img.src=r.result};
  r.readAsDataURL(el.files[0]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});

(document.fonts?document.fonts.ready:Promise.resolve()).catch(()=>{}).then(()=>{if(S.screen==='match'||S.screen==='pending')S.screen=S.paid?'discover':'site';render()});
</script>
</body>
</html>
