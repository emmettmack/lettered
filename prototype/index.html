<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lettered App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Lettered: a private room. Monochrome, photography-led, almost no chrome. */
  --night:#0C0C0B;
  --night-2:#161614;
  --night-3:#24231F;
  --bone:#F1EEE7;
  --ash:#8C8980;
  --smoke:#5C5A54;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  /* Layout: phone-first; on desktop the phone sits beside a quiet screen index. */
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050505;color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
:focus-visible{outline:1px solid var(--bone);outline-offset:3px;border-radius:4px}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:80px;padding:40px 24px}
.index{width:260px;display:flex;flex-direction:column;gap:26px}
.index .wm{font-family:var(--serif);font-weight:300;font-size:40px;letter-spacing:-.5px;line-height:1}
.index p{color:var(--ash);font-size:14px;line-height:1.6}
.index nav{display:flex;flex-direction:column}
.index nav button{padding:9px 0;font-size:14px;color:var(--ash);border-bottom:1px solid #1C1C1A;display:flex;justify-content:space-between}
.index nav button span{color:var(--smoke);font-variant-numeric:tabular-nums}
.index nav button[aria-current="true"]{color:var(--bone)}
.index h4{font-size:12px;color:var(--smoke);font-weight:500;margin:14px 0 4px}

.phone{width:390px;height:844px;border-radius:56px;background:#000;padding:9px;box-shadow:0 0 0 1px #222,0 50px 100px -30px rgba(0,0,0,.9);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--night)}
@media (max-width:820px){
  .index{display:none}.stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}
}

.status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0;font-size:15px;font-weight:600;z-index:6;pointer-events:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .35s ease-out}
@keyframes in{from{opacity:0}}
.pad{padding:0 28px}
.grow{flex:1}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

.wm{font-family:var(--serif);font-weight:300;letter-spacing:-.02em;line-height:1}
.serif{font-family:var(--serif);font-weight:300;letter-spacing:-.01em}
.muted{color:var(--ash)}
.small{font-size:13px;line-height:1.55}

.cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:28px;background:var(--bone);color:var(--night);font-weight:600;font-size:16px;text-align:center;transition:transform .12s}
.cta:active{transform:scale(.985)}
.cta.ghost{background:none;color:var(--bone);box-shadow:inset 0 0 0 1px var(--night-3)}
.cta[disabled]{opacity:.35;cursor:default}
.textlink{display:block;width:100%;text-align:center;font-size:15px;color:var(--ash);padding:14px 0}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-12px}
.top{height:56px;margin-top:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.foot{padding:12px 28px 36px;display:flex;flex-direction:column;gap:4px}

/* website */
.site{background:#F1EEE7;color:#141412}
.site .body{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:120px 30px 30px}
.site .wm{font-size:64px}
.site p{font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.3;max-width:280px;margin-top:22px}
.site .meta{font-size:13px;color:#77746C;line-height:1.6}
.safari{height:86px;background:#E6E2D9;border-top:1px solid #D3CEC2;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:10px}
.safari .url{width:88%;height:42px;border-radius:13px;background:#F7F5F0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#141412;gap:6px}
.site .open{font-size:15px;font-weight:600;border-bottom:1px solid #141412;align-self:flex-start;padding-bottom:2px}

/* door */
.door .hero{padding:150px 28px 0}
.door .wm{font-size:58px}
.door .hero p{margin-top:16px;font-size:16px;color:var(--ash);line-height:1.55;max-width:280px}
.choices{margin-top:auto;border-top:1px solid var(--night-3)}
.choice{display:flex;align-items:center;justify-content:space-between;width:100%;padding:24px 28px;border-bottom:1px solid var(--night-3)}
.choice b{display:block;font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:-.01em}
.choice span{display:block;font-size:13px;color:var(--ash);margin-top:4px}

/* forms */
.h{font-family:var(--serif);font-weight:300;font-size:40px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:15px;color:var(--ash);line-height:1.6;margin-top:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:26px}
.field label{font-size:12px;color:var(--ash)}
.field input,.field textarea{background:none;border:0;border-bottom:1px solid var(--night-3);padding:10px 0;font-size:18px;border-radius:0}
.field textarea{resize:none;height:84px;font-size:16px;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--bone)}
.field input::placeholder,.field textarea::placeholder{color:var(--smoke)}
.progress{display:flex;gap:6px;width:72px}
.progress i{flex:1;height:2px;background:var(--night-3)}.progress i.on{background:var(--bone)}
.kinds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kinds button{height:38px;padding:0 16px;border-radius:19px;font-size:14px;box-shadow:inset 0 0 0 1px var(--night-3);color:var(--ash)}
.kinds button[aria-pressed="true"]{background:var(--bone);color:var(--night);box-shadow:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:22px}
.photos button{aspect-ratio:3/4;border-radius:10px;background:var(--night-2);display:grid;place-items:center;color:var(--smoke);font-size:24px;font-weight:300;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover;display:block}

/* quiet states */
.quiet{justify-content:center;padding:0 32px}
.quiet .h{font-size:46px}
.quiet .wm{font-size:22px;position:absolute;top:70px;left:32px}
.rule{width:28px;height:1px;background:var(--ash);margin:26px 0}

/* mail */
.mail{background:#FFFFFF;color:#111}
.mail .bar{height:56px;margin-top:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#0A60FF;font-size:17px}
.mail .from{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid #EAEAEA}
.mail .av{width:40px;height:40px;border-radius:20px;background:#111;color:#F1EEE7;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:300}
.mail .from b{font-size:16px;display:block}.mail .from span{font-size:13px;color:#8A8A8A}
.mail h2{font-size:24px;font-weight:600;padding:18px 20px 0}
.mail .letter{padding:22px 20px;font-family:var(--serif);font-size:20px;line-height:1.55;font-weight:300;display:flex;flex-direction:column;gap:16px}
.mail .letter a{color:#111;border-bottom:1px solid #111;align-self:flex-start;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer}

/* accepted + membership */
.accept .h{font-size:52px}
.card{margin-top:30px;aspect-ratio:1.586;border-radius:18px;background:linear-gradient(155deg,#1E1E1B 0%,#0F0F0E 60%,#181816 100%);box-shadow:inset 0 0 0 1px #2C2B27,0 30px 50px -20px rgba(0,0,0,.8);padding:22px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(241,238,231,.06) 50%,transparent 60%);animation:sheen 3.2s ease-in-out 1}
@keyframes sheen{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.card .wm{font-size:26px}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--ash)}
.card .row b{display:block;color:var(--bone);font-size:16px;font-weight:500;margin-top:3px;letter-spacing:.02em}
.price{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--night-3);margin-top:22px}
.price b{font-family:var(--serif);font-weight:300;font-size:30px;font-variant-numeric:tabular-nums}

/* pay sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:8;animation:in .2s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#1C1C1E;border-radius:38px;padding:22px 22px 30px;z-index:9;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}
.sheet .x{width:30px;height:30px;border-radius:15px;background:#2C2C2E;display:grid;place-items:center;color:#9A9AA0}
.sheet .line{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2C2C2E;font-size:15px}
.sheet .line span{color:#9A9AA0}
.sheet .confirm{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:#9A9AA0}
.sheet .confirm button{width:100%;height:52px;border-radius:14px;background:var(--bone);color:#000;font-weight:600;text-align:center}

/* discover */
.dtop{position:absolute;top:52px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:4}
.modes{display:flex;gap:20px}
.modes button{font-family:var(--serif);font-size:22px;font-weight:300;color:rgba(241,238,231,.45)}
.modes button[aria-pressed="true"]{color:var(--bone)}
.frame{position:relative;flex:1;margin:0;overflow:hidden;background:var(--night-2)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .tap{position:absolute;top:0;bottom:0;width:50%;z-index:2}.frame .l{left:0}.frame .r{right:0}
.frame .ticks{position:absolute;top:110px;left:24px;right:24px;display:flex;gap:4px;z-index:3}
.frame .ticks i{flex:1;height:2px;background:rgba(241,238,231,.25)}.frame .ticks i.on{background:var(--bone)}
.frame .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(12,12,11,.96) 8%,rgba(12,12,11,0))}
.frame .shadetop{position:absolute;inset:0 0 auto 0;height:180px;background:linear-gradient(to bottom,rgba(12,12,11,.7),rgba(12,12,11,0))}
.cap{position:absolute;left:24px;right:24px;bottom:22px;z-index:3}
.cap h3{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em}
.cap h3 span{color:var(--ash);font-size:30px;margin-left:8px}
.cap .what{font-size:15px;margin-top:8px}
.cap .note{font-size:14px;color:var(--ash);margin-top:6px;line-height:1.45}
.cap .song{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ash);margin-top:12px}
.cap .song i{width:6px;height:6px;border-radius:3px;background:var(--bone);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.acts{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px}
.acts button{height:50px;border-radius:25px;padding:0 26px;font-size:15px;font-weight:500}
.acts .pass{box-shadow:inset 0 0 0 1px var(--night-3);color:var(--ash)}
.acts .yes{background:var(--bone);color:var(--night);flex:1;margin-left:12px;text-align:center}

.tabs{display:flex;justify-content:space-around;padding:10px 0 30px;border-top:1px solid #1A1A18}
.tabs button{font-size:13px;color:var(--smoke);padding:6px 10px}
.tabs button[aria-current="true"]{color:var(--bone)}

/* match */
.match{justify-content:flex-end;padding:0 28px 40px}
.match .bg{position:absolute;inset:0;opacity:.35}
.match .bg img{width:100%;height:100%;object-fit:cover;filter:blur(2px)}
.match .bgshade{position:absolute;inset:0;background:linear-gradient(to top,var(--night) 35%,rgba(12,12,11,.4))}
.match .content{position:relative}
.match .h{font-size:50px}

/* messages */
.title{font-family:var(--serif);font-weight:300;font-size:40px;letter-spacing:-.02em;padding:6px 28px 18px}
.thread{display:flex;gap:14px;align-items:center;width:100%;padding:14px 28px}
.thumb{width:52px;height:52px;border-radius:26px;overflow:hidden;flex:none;background:var(--night-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thread .t{flex:1;min-width:0}
.thread b{display:block;font-weight:500;font-size:16px}
.thread span{display:block;color:var(--ash);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread time{font-size:12px;color:var(--smoke);align-self:flex-start;margin-top:4px}
.unread{width:7px;height:7px;border-radius:4px;background:var(--bone)}
.newrow{display:flex;gap:14px;padding:0 28px 22px;overflow-x:auto;scrollbar-width:none}
.newrow .thumb{width:62px;height:82px;border-radius:12px}
.sect{font-size:12px;color:var(--smoke);padding:0 28px 6px}

/* chat */
.chathead{display:flex;align-items:center;gap:12px;height:60px;margin-top:52px;padding:0 20px;border-bottom:1px solid #1A1A18}
.chathead .thumb{width:36px;height:36px}
.chathead b{font-weight:500}
.bubbles{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.b{max-width:78%;padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.4}
.b.them{background:var(--night-2);align-self:flex-start}
.b.me{background:var(--bone);color:var(--night);align-self:flex-end}
.compose{display:flex;gap:10px;align-items:center;padding:10px 14px 32px}
.compose input{flex:1;height:44px;border-radius:22px;background:var(--night-2);border:0;padding:0 18px;font-size:16px}
.compose input:focus{outline:1px solid var(--night-3)}
.compose button{height:44px;padding:0 16px;border-radius:22px;font-weight:600;font-size:15px}

/* you */
.mehead{display:flex;gap:16px;align-items:center;padding:0 28px}
.mehead .thumb{width:72px;height:72px;border-radius:36px}
.mehead h3{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1}
.mehead p{font-size:14px;color:var(--ash);margin-top:6px}
.group{padding:26px 28px 0}
.group h4{font-size:12px;color:var(--smoke);font-weight:500;margin-bottom:4px}
.set{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #1C1C1A;width:100%}
.set .t{flex:1}
.set b{display:block;font-weight:500;font-size:16px}
.set span{display:block;font-size:13px;color:var(--ash);line-height:1.45;margin-top:3px}
.set em{font-style:normal;color:var(--ash);font-size:15px;font-variant-numeric:tabular-nums}
.tog{width:48px;height:28px;border-radius:14px;background:var(--night-3);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--ash);transition:transform .2s,background .2s}
.tog[aria-checked="true"]{background:var(--bone)}
.tog[aria-checked="true"]::after{transform:translateX(20px);background:var(--night)}

.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,8px);background:var(--bone);color:var(--night);font-size:14px;font-weight:500;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="index">
    <div class="wm">lettered</div>
    <p>Prototype. Two ways in: an invitation for the Roster, or an application to the committee. Nothing is visible until you’re a member.</p>
    <nav id="nav" aria-label="Screens"></nav>
  </aside>
  <div class="phone"><div class="screen" id="app"></div></div>
</div>

<script>
const S={screen:'site',door:null,step:1,kinds:['Surf'],added:0,mode:'Date',idx:0,ph:0,sheet:false,code:'',
  chatWith:'Ava',tog:{school:true,pause:false},
  msgs:{Ava:[['them','You’re the sprinter from USC? I’ve seen you on the warm-up track.'],['me','Guilty. You were at the UCLA meet?'],['them','Front row. Drinks Thursday?']],
        Kai:[['them','Dawn patrol at Rincon this weekend if the swell holds.']],
        Jordan:[['me','Tokyo or Paris, which pool was faster?'],['them','Paris. Don’t tell Tokyo.']]}};

const P=[
 {n:'Ava',age:23,what:'Soccer, UCLA',note:'Team captain, 2020–24',song:'“Kiss Me More” by Doja Cat',type:'pitch',m:'Date'},
 {n:'Kai',age:26,what:'Surfer, Santa Cruz',note:'Shapes his own boards',song:'“Redbone” by Childish Gambino',type:'wave',m:'Date'},
 {n:'Jordan',age:27,what:'Swimming, Olympian',note:'Michigan, then two Games',song:'“Electric Feel” by MGMT',type:'pool',m:'Date'},
 {n:'Maya',age:24,what:'Volleyball, Stanford',note:'All-Pac-12, 2022',song:'“Dreams” by Fleetwood Mac',type:'court',m:'Date'},
 {n:'Lena',age:28,what:'Strength coach, West Hollywood',note:'Former D1 heptathlete',song:'“Nights” by Frank Ocean',type:'gym',m:'Date'},
 {n:'Theo',age:25,what:'Skater, Venice',note:'Looking for a crew for early sessions',song:'“Nangs” by Tame Impala',type:'ramp',m:'Friends'},
 {n:'Nia',age:24,what:'Basketball, Howard',note:'Runs Sunday pickup in Culver City. Always short one.',song:'“HUMBLE.” by Kendrick Lamar',type:'court',m:'Friends'},
 {n:'Sam',age:22,what:'Track and field, UCLA',note:'Wants a tempo-run crew on the Westwood loop',song:'“Run This Town” by Jay-Z',type:'track',m:'Friends'}
];

/* ---------- monochrome placeholder photography ---------- */
const F={};let grain;
function mkGrain(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const d=x.createImageData(180,180);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=26}x.putImageData(d,0,0);return c}
function shot(p,k,seed){
  const W=744,H=1180,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const tone=[22,26,30,24,28][seed%5];
  x.fillStyle=`rgb(${tone},${tone},${tone-2})`;x.fillRect(0,0,W,H);
  const lx=[.25,.75,.5][k]*W,ly=[.2,.32,.12][k]*H;
  const g=x.createRadialGradient(lx,ly,10,lx,ly,H*.9);g.addColorStop(0,'rgba(241,238,231,.30)');g.addColorStop(.5,'rgba(241,238,231,.05)');g.addColorStop(1,'rgba(0,0,0,.4)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(241,238,231,.13)';x.lineWidth=3;x.save();
  x.translate(W/2,H/2);x.rotate([0,-.1,.08][k]);x.scale([1,1.25,1.6][k],[1,1.25,1.6][k]);x.translate(-W/2,-H/2);
  const t=p.type;
  if(t==='track'){for(let i=0;i<9;i++){x.beginPath();x.arc(W*1.15,H*1.05,300+i*78,Math.PI,Math.PI*1.5);x.stroke()}}
  else if(t==='pool'){for(let i=1;i<6;i++){x.setLineDash([16,18]);x.beginPath();x.moveTo(i*W/6,0);x.lineTo(i*W/6,H);x.stroke()}x.setLineDash([])}
  else if(t==='court'){x.strokeRect(W*.1,H*.15,W*.8,H*.7);x.beginPath();x.moveTo(W*.1,H*.5);x.lineTo(W*.9,H*.5);x.stroke();x.beginPath();x.arc(W/2,H*.5,110,0,7);x.stroke()}
  else if(t==='pitch'){x.beginPath();x.moveTo(0,H*.55);x.lineTo(W,H*.55);x.stroke();x.beginPath();x.arc(W/2,H*.55,170,0,7);x.stroke();x.strokeRect(W*.22,-4,W*.56,H*.17)}
  else if(t==='wave'){for(let i=0;i<14;i++){x.beginPath();for(let X=0;X<=W;X+=8){const Y=H*.3+i*52+Math.sin(X/90+i*.7)*18*(1+i*.08);X?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke()}}
  else if(t==='ramp'){for(let i=0;i<8;i++){x.beginPath();x.moveTo(0,H*.35+i*22);x.quadraticCurveTo(W*.1,H*.85+i*10,W,H*.86+i*22);x.stroke()}}
  else{for(let i=0;i<10;i++){x.beginPath();x.moveTo(0,i*H/10);x.lineTo(W,i*H/10);x.stroke()}for(let i=0;i<6;i++){x.beginPath();x.moveTo(i*W/6,0);x.lineTo(i*W/6,H);x.stroke()}}
  x.restore();
  x.fillStyle=x.createPattern(grain,'repeat');x.fillRect(0,0,W,H);
  return c.toDataURL('image/jpeg',.85);
}
function build(){grain=mkGrain();P.forEach((p,i)=>F[p.n]=[0,1,2].map(k=>shot(p,k,i)));F.me=[shot({type:'track'},0,3)]}

/* ---------- pieces ---------- */

const back=to=>`<button class="back" data-go="${to}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`;
const tabs=c=>`<nav class="tabs" aria-label="Main">${[['discover','Discover'],['messages','Messages'],['you','You']].map(([k,l])=>`<button data-go="${k}" aria-current="${c===k}">${l}</button>`).join('')}</nav>`;
const thumb=n=>`<span class="thumb"><img src="${F[n]?F[n][0]:F.me[0]}" alt=""></span>`;
const list=()=>P.filter(p=>p.m===S.mode);

/* ---------- screens ---------- */
const V={
site:()=>`<section class="view site">${stat(false)}
  <div class="body">
    <div><div class="wm">lettered</div><p>A private room for athletes.</p></div>
    <div style="display:flex;flex-direction:column;gap:18px">

  </div>

</section>`,

door:()=>`<section class="view door">${stat()}
  <div class="hero"><div class="wm">lettered</div></div>

  </div>

</section>`,

invite:()=>`<section class="view">${stat()}
  <div class="top">${back('door')}<span></span></div>

    <h2 class="h">You don’t need to apply.</h2>

  </div>

</section>`,

apply:()=>{
  const st=S.step;let b='';
  if(st===1) b=`<h2 class="h">Tell us who you are.</h2>
    <p class="lead">Athletes, surfers, skaters, coaches. If you live it, apply.</p>
    <div class="field"><label>What describes you? Pick all that fit.</label><div class="kinds" role="group">${['College athlete','Pro athlete','Surf','Skate','Fitness','Coach','Other'].map(k=>`<button data-kind="${k}" aria-pressed="${S.kinds.includes(k)}">${k}</button>`).join('')}</div></div>
    <div class="field"><label for="nm">First name</label><input id="nm" value="Emmett" autocomplete="off"></div>

    <div class="field"><label for="sg">The song that plays on your profile</label><input id="sg" placeholder="Song and artist" autocomplete="off"></div>`;
  if(st===3) b=`<h2 class="h">Who knows you here?</h2>
    <p class="lead">A member who vouches for you helps. It doesn’t guarantee anything.</p>
    <div class="field"><label for="vc">Member who can vouch for you</label><input id="vc" placeholder="Optional" autocomplete="off"></div>
    <div class="field"><label for="why">What would you add to the room?</label><textarea id="why" placeholder="Keep it short."></textarea></div>`;
  return `<section class="view">${stat()}
  <div class="top">${back(st===1?'door':'apply-back')}<div class="progress" aria-label="Step ${st} of 3">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div></div>
  <div class="scroll pad">${b}<div style="height:20px"></div></div>
  <div class="foot"><button class="cta" data-act="next">${st<3?'Continue':'Submit to the committee'}</button></div>
</section>`},

pending:()=>`<section class="view quiet">${stat()}
  <div class="wm">lettered</div>
  <h2 class="h">Received.</h2>
  <div class="rule"></div>
  <p class="lead" style="margin:0">The committee reviews every application. We don’t share timelines, positions or decisions in progress.</p>
  <p class="lead">If you’re accepted, you’ll hear from us.</p>
</section>`,

mail:()=>`<section class="view mail">${stat(false)}
  <div class="bar"><span>‹ Inbox</span><span style="color:#8A8A8A;font-size:14px">8:12 AM</span></div>
  <div class="from"><span class="av">l</span><span><b>Lettered</b><span>to me</span></span></div>
  <h2>Lettered</h2>
  <div class="letter">
    <span>Emmett,</span>
    <span>The committee has reviewed your application. You’re in.</span>
    <span>Your acceptance doesn’t expire. Open the app whenever you’re ready.</span>
    <a data-go="accepted" role="button" tabindex="0">Open Lettered</a>
  </div>
</section>`,

accepted:()=>`<section class="view accept">${stat()}
  <div class="scroll pad" style="padding-top:110px">
    <h2 class="h">${S.door==='roster'?'You were expected.':'Accepted.'}</h2>
    <p class="lead">${S.door==='roster'?'Your roster checked out. Your membership is ready when you are.':'The committee said yes. It doesn’t say that often.'}</p>
    <div class="card" aria-label="Membership card">
      <div class="wm">lettered</div>
      <div class="row"><span>Member<b>EMMETT</b></span><span style="text-align:right">${S.door==='roster'?'Roster':'Admitted'}<b>${S.door==='roster'?'TRACK, USC':'BY COMMITTEE'}</b></span></div>
    </div>
    <div class="price"><span class="muted">Membership</span><b>$7.99<span class="muted" style="font-size:15px;font-family:var(--sans)"> / month</span></b></div>
    <p class="small muted" style="margin-top:14px">Members only. Nothing in the app is visible until your membership starts.</p>
  </div>
  <div class="foot"><button class="cta" data-act="pay">Start membership</button><button class="textlink" data-go="code">I have a code</button></div>
</section>`,

code:()=>`<section class="view">${stat()}
  <div class="top">${back('accepted')}<span></span></div>
  <div class="scroll pad">
    <h2 class="h">Enter your code.</h2>
    <p class="lead">Codes come from the founder. They cover your membership in full.</p>
    <div class="field"><label for="cc">Code</label><input id="cc" value="${S.code}" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" style="letter-spacing:.12em;text-transform:uppercase"></div>
  </div>
  <div class="foot"><button class="cta" data-act="usecode">Apply code</button></div>
</section>`,

discover:()=>{const L=list(),p=L[S.idx%L.length];return `<section class="view">${stat()}
  <div class="dtop"><div class="modes" role="group" aria-label="Mode">${['Date','Friends'].map(m=>`<button data-mode="${m}" aria-pressed="${S.mode===m}">${m}</button>`).join('')}</div></div>
  <div class="frame">
    <img src="${F[p.n][S.ph]}" alt="${p.n}, photo ${S.ph+1} of 3">
    <div class="shadetop"></div><div class="shade"></div>
    <div class="ticks">${[0,1,2].map(i=>`<i class="${i===S.ph?'on':''}"></i>`).join('')}</div>
    <button class="tap l" data-act="prev" aria-label="Previous photo"></button><button class="tap r" data-act="nextph" aria-label="Next photo"></button>
    <div class="cap"><h3>${p.n}<span>${p.age}</span></h3><p class="what">${p.what}</p><p class="note">${p.note}</p><p class="song"><i></i>${p.song}</p></div>
  </div>
  <div class="acts"><button class="pass" data-act="pass">Pass</button><button class="yes" data-act="yes">${S.mode==='Date'?'Interested':'Let’s train'}</button></div>
  ${tabs('discover')}
</section>`},

match:()=>{const L=list(),p=L[S.idx%L.length];return `<section class="view match">
  <div class="bg"><img src="${F[p.n][0]}" alt=""></div><div class="bgshade"></div>${stat()}
  <div class="content">
    <h2 class="h">${S.mode==='Date'?`${p.n} is interested too.`:`${p.n} is in.`}</h2>
    <p class="lead">${S.mode==='Date'?'Only the two of you can see this.':'Pick a time and a place.'}</p>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:30px">
      <button class="cta" data-act="chat" data-who="${p.n}">Message ${p.n}</button>
      <button class="textlink" data-act="keep">Keep looking</button>
    </div>
  </div>
</section>`},

messages:()=>{const last=n=>{const m=S.msgs[n];return m&&m.length?m[m.length-1][1]:'Say something'};return `<section class="view">${stat()}
  <div style="height:58px"></div><h2 class="title">Messages</h2>
  <p class="sect">New</p>
  <div class="newrow">${['Maya','Lena','Nia','Theo'].map(n=>`<button data-act="chat" data-who="${n}" aria-label="Message ${n}">${thumb(n)}</button>`).join('')}</div>
  <p class="sect">Conversations</p>
  <div class="scroll">${[['Ava','2m',1],['Kai','1h',1],['Jordan','Tue',0]].map(([n,t,u])=>`<button class="thread" data-act="chat" data-who="${n}">${thumb(n)}<span class="t"><b>${n}</b><span>${last(n)}</span></span><time>${t}</time>${u?'<i class="unread" aria-label="Unread"></i>':''}</button>`).join('')}</div>
  ${tabs('messages')}
</section>`},

chat:()=>{const n=S.chatWith,m=S.msgs[n]||(S.msgs[n]=[]);return `<section class="view">${stat()}
  <div class="chathead">${back('messages')}${thumb(n)}<b>${n}</b></div>
  <div class="bubbles" id="bb">${m.map(([w,t])=>`<div class="b ${w}">${t}</div>`).join('')}</div>
  <form class="compose" id="cf"><label for="mi" style="position:absolute;left:-9999px">Message</label><input id="mi" placeholder="Message" autocomplete="off"><button>Send</button></form>
</section>`},

you:()=>`<section class="view">${stat()}
  <div class="scroll" style="padding-top:76px">
    <div class="mehead">${thumb('me')}<div><h3>Emmett</h3><p>${S.door==='roster'?'Roster, track and field, USC':'Admitted by the committee'}</p></div></div>
    <div class="group"><h4>Privacy</h4>
      <div class="set"><div class="t"><b>Hide from my school</b><span>USC athletes and students won’t see you.</span></div><button class="tog" role="switch" data-tog="school" aria-checked="${S.tog.school}" aria-label="Hide from my school"></button></div>
      <div class="set"><div class="t"><b>Pause my profile</b><span>Disappear from Discover. Your matches stay.</span></div><button class="tog" role="switch" data-tog="pause" aria-checked="${S.tog.pause}" aria-label="Pause my profile"></button></div>
    </div>
    <div class="group"><h4>Invitations</h4>
      <div class="set"><div class="t"><b>Vouches left</b><span>Vouch for an applicant. The committee still decides.</span></div><em>2</em></div>
    </div>
    <div class="group"><h4>Membership</h4>
      <div class="set"><div class="t"><b>${S.paid==='code'?'Covered by code':'$7.99 a month'}</b><span>${S.paid==='code'?'No card on file.':'Renews December 12.'}</span></div></div>
    </div>
    <div style="height:30px"></div>
  </div>
  ${tabs('you')}
</section>`
};

const NAV=[['Outside',[['site','The website'],['door','Two doors']]],['Roster',[['invite','Invitation']]],['Everyone else',[['apply','Application'],['pending','Received'],['mail','The email']]],['Membership',[['accepted','Accepted'],['code','Code']]],['Inside',[['discover','Discover'],['match','Match'],['messages','Messages'],['chat','Chat'],['you','You']]]];

const app=document.getElementById('app');let tm;
function render(){
  app.innerHTML=V[S.screen]()+(S.sheet?sheet():'')+'<div class="toast" id="toast" role="status"></div>';
  let i=0;document.getElementById('nav').innerHTML=NAV.map(([g,items])=>`<h4>${g}</h4>`+items.map(([k,l])=>`<button data-go="${k}" aria-current="${S.screen===k}">${l}<span>${String(++i).padStart(2,'0')}</span></button>`).join('')).join('');
  clearTimeout(tm);
  if(S.screen==='pending') tm=setTimeout(()=>{S.screen='mail';render()},4200);
  if(S.screen==='chat'){const b=document.getElementById('bb');b.scrollTop=b.scrollHeight}
}
const sheet=()=>`<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-label="Confirm membership">
  <div class="hd"><span>Apple Pay</span><button class="x" data-act="closesheet" aria-label="Cancel">✕</button></div>
  <div class="line" style="margin-top:12px"><span>Card</span>Visa ending 4417</div>
  <div class="line"><span>Subscription</span>Lettered Membership</div>
  <div class="line"><span>Price</span>$7.99 / month</div>
  <div class="confirm"><button data-act="paid">Pay $7.99</button>Cancel anytime in Settings</div></div>`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function go(s){S.screen=s;S.sheet=false;if(s==='apply')S.step=S.step||1;if(s==='discover'){S.ph=0}render()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-kind],[data-mode],[data-tog]');if(!t)return;const d=t.dataset;
  if(d.go){if(d.go==='apply-back'){S.step--;render();return}if(d.go==='apply'){S.door='app';S.step=1}if(d.go==='invite')S.door='roster';if(d.go==='accepted'&&!S.door)S.door='app';go(d.go);return}
  if(d.kind){const i=S.kinds.indexOf(d.kind);i<0?S.kinds.push(d.kind):S.kinds.splice(i,1);render();return}
  if(d.mode){S.mode=d.mode;S.idx=0;S.ph=0;render();return}
  if(d.tog){S.tog[d.tog]=!S.tog[d.tog];render();return}
  switch(d.act){
    case 'apply':S.door='app';S.step=1;go('apply');break;
    case 'next':if(S.step<3){S.step++;render()}else go('pending');break;
    case 'addphoto':S.added=Math.min(6,S.added+1);render();break;
    case 'rosterok':S.door='roster';go('accepted');break;
    case 'pay':S.sheet=true;render();break;
    case 'closesheet':S.sheet=false;render();break;
    case 'paid':S.paid='card';S.sheet=false;go('discover');break;
    case 'usecode':{const v=(document.getElementById('cc').value||'').trim();if(!v){toast('Enter the code you were given');break}S.paid='code';go('discover');setTimeout(()=>toast('Membership covered'),50);break}
    case 'prev':S.ph=(S.ph+2)%3;render();break;
    case 'nextph':S.ph=(S.ph+1)%3;render();break;
    case 'pass':S.idx++;S.ph=0;render();break;
    case 'yes':go('match');break;
    case 'keep':S.idx++;go('discover');break;
    case 'chat':S.chatWith=d.who;go('chat');break;
  }
});
document.addEventListener('submit',e=>{if(e.target.id!=='cf')return;e.preventDefault();const v=document.getElementById('mi').value.trim();if(!v)return;S.msgs[S.chatWith].push(['me',v]);render();document.getElementById('mi').focus()});
(document.fonts?document.fonts.ready:Promise.resolve()).catch(()=>{}).then(()=>{build();render()});
</script>
